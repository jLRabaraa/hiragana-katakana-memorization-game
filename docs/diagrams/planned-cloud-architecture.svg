<text x="655" y="878" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Versioned v3 records per Firebase UID</text>
<text x="655" y="908" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Completions + projections + upload outbox</text>
<text x="655" y="938" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">No unfinished quiz or raw drawings</text>
