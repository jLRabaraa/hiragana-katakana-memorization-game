<text x="95" y="1178" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Reviewed guides and compatible updates</text>
<rect x="635" y="1050" width="480" height="155" rx="8" fill="#eaf5f6" stroke="#bdc8d0"/>
