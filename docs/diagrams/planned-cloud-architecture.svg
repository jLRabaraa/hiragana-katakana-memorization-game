<text x="95" y="598" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Apply pure learning rules; atomically commit completions and upload outbox entries</text>
<text x="95" y="628" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Expose local / syncing / synced / sign-in-required / cloud-unavailable status</text>
<text x="95" y="658" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Isolate all local records, listeners, and uploads by account UID</text>
