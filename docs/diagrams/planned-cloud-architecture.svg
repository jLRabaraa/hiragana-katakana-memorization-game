<text x="1270" y="842" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#243746">Firestore Standard database</text>
<text x="1270" y="878" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">users/{uid}/completions/{completionId}</text>
<text x="1270" y="908" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Completed lessons, rounds, tracing</text>
<text x="1270" y="938" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Reading, review, and habit evidence</text>
