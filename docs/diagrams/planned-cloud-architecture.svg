<polyline points="1238.2941876694151,605.654551943446 1250,600 1238.2941876694151,594.345448056554" fill="none" stroke="#526b7b" stroke-width="2"/>
<text x="980" y="1267" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#526b7b">Firebase client SDK</text>
<text x="1245" y="1050" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#243746">Immutable completions → rebuildable progress</text>
<text x="1245" y="1090" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#243746">Union passes and per-kana tracing completion</text>
<text x="1245" y="1120" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#243746">Keep highest scores; tally each round once</text>
<text x="1245" y="1150" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#243746">No full-progress last-write-wins uploads</text>
<text x="1245" y="1180" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#243746">No deployed custom API or paid services</text>
<text x="60" y="1307" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#243746">Guided tracing: required once per new kana; reveal only accepted strokes; all strokes required; no points or recall credit.</text>
<text x="60" y="1347" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Fresh Google accounts: leave v2 / legacy saves untouched and do not import them. Commit tracing when the round finishes.</text>
<text x="60" y="1387" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Offline startup requires prior online sign-in and caching. Pending uploads wait for valid authentication and available quota.</text>
<text x="60" y="1433" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#526b7b">Dashed arrows denote dependencies. Secondary UI/data dependencies omitted. Current implementation remains localStorage-only.</text>
</svg>
