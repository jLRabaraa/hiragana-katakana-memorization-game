<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1490" viewBox="0 0 1800 1490" role="img" aria-labelledby="title description"><title id="title">planned-cloud-architecture</title><desc id="description">Planned UML component diagram separating browser UI, authentication, pure engine, account-scoped IndexedDB and synchronization from Firebase Authentication, Security Rules, and Firestore on Spark without billing.</desc>
