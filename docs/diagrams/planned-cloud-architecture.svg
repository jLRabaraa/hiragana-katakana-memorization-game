<text x="1270" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Google sign-in; public registration</text>
<text x="1270" y="358" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">First sign-in requires internet</text>
<text x="1270" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Account UID identifies progress owner</text>
