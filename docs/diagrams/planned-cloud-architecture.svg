<rect x="1250" y="500" width="475" height="190" rx="8" fill="#f2effa" stroke="#bdc8d0"/>
<text x="1270" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#526b7b">«component»</text>
<text x="1270" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#243746">Firestore Security Rules</text>
<text x="1270" y="598" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Check authenticated UID ownership</text>
<text x="1270" y="628" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Validate fields, types, sizes, operations</text>
<text x="1270" y="658" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Deny changes to committed completions</text>
<rect x="1250" y="780" width="475" height="195" rx="8" fill="#eaf5f6" stroke="#bdc8d0"/>
