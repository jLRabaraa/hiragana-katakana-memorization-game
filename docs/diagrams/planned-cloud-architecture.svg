<text x="655" y="1148" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Unique IDs; retries; incremental downloads</text>
<text x="655" y="1178" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#243746">Combine completed work across devices</text>
